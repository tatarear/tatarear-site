name: Actualizar muro

on:
  repository_dispatch:
    types: [update-muro]

permissions:
  contents: write

jobs:
  update-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Escribir muro.json
        run: |
          mkdir -p data
          echo '${{ toJson(github.event.client_payload.posts) }}' > data/muro.json
      - name: Commit y push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/muro.json
          git commit -m "Actualizar muro" || echo "Sin cambios"
          git push
EOF
